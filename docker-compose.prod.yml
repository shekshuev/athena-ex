version: "3.8"

# Images are published per Ubuntu version isolate was built and smoke-tested
# on (see .github/workflows/release.yml) – set IMAGE_OS in .env to "u22" or
# "u24" to match the Ubuntu version this host actually runs (defaults to
# u24). This matters because isolate runs --privileged and shares the host
# kernel, so its behavior isn't guaranteed portable across kernel versions.
services:
  # Ephemeral execution databases; all production services are defined here.
  athena_runner_mysql:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_RUNNER_PASSWORD:?Set MYSQL_RUNNER_PASSWORD in .env}
      MARIADB_ROOT_HOST: "%"
    command:
      - --local-infile=0
      - --max-allowed-packet=1M
      - --max-connections=32
      - --innodb-buffer-pool-size=64M
      - --tmp-table-size=16M
      - --max-heap-table-size=16M
      - --skip-log-bin
    ports:
      - "127.0.0.1:${MYSQL_RUNNER_PORT:-3307}:3306"
    tmpfs:
      - /var/lib/mysql:size=512m
      - /tmp:size=128m
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 30

  athena_runner_clickhouse:
    image: clickhouse/clickhouse-server:25.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: runner_admin
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_RUNNER_PASSWORD:?Set CLICKHOUSE_RUNNER_PASSWORD in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:${CLICKHOUSE_RUNNER_PORT:-8124}:8123"
    volumes:
      - ./docker/clickhouse/execution.xml:/etc/clickhouse-server/config.d/execution.xml:ro
    tmpfs:
      - /var/lib/clickhouse:size=768m
      - /var/log/clickhouse-server:size=64m
      - /tmp:size=128m
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1' > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30

  athena_web:
    image: ghcr.io/shekshuev/athena-ex-web:latest-${IMAGE_OS:-u24}
    container_name: athena_web
    restart: always
    network_mode: "host"
    env_file:
      - .env
    environment:
      - RELEASE_DISTRIBUTION=name
      - RELEASE_NODE=web@127.0.0.1
      - RELEASE_COOKIE=${RELEASE_COOKIE}
    depends_on:
      - postgres
      - minio

  # SQL challenges use per-engine role/database sandboxing,
  # so this image has no isolate and no compilers at all.
  athena_runner_db:
    image: ghcr.io/shekshuev/athena-ex-runner-db:latest-${IMAGE_OS:-u24}
    container_name: athena_runner_db
    restart: always
    network_mode: "host"
    env_file:
      - .env
    environment:
      - RELEASE_DISTRIBUTION=name
      - RELEASE_NODE=runner_db@127.0.0.1
      - RELEASE_COOKIE=${RELEASE_COOKIE}
    depends_on:
      - athena_runner_pg
      - athena_runner_mysql
      - athena_runner_clickhouse

  athena_runner_compiled:
    image: ghcr.io/shekshuev/athena-ex-runner-compiled:latest-${IMAGE_OS:-u24}
    container_name: athena_runner_compiled
    privileged: true
    restart: always
    network_mode: "host"
    env_file:
      - .env
    environment:
      - RELEASE_DISTRIBUTION=name
      - RELEASE_NODE=runner_compiled@127.0.0.1
      - RELEASE_COOKIE=${RELEASE_COOKIE}

  athena_runner_script:
    image: ghcr.io/shekshuev/athena-ex-runner-script:latest-${IMAGE_OS:-u24}
    container_name: athena_runner_script
    privileged: true
    restart: always
    network_mode: "host"
    env_file:
      - .env
    environment:
      - RELEASE_DISTRIBUTION=name
      - RELEASE_NODE=runner_script@127.0.0.1
      - RELEASE_COOKIE=${RELEASE_COOKIE}

  athena_runner_pg:
    image: postgres:16-alpine
    container_name: athena_runner_pg_dev
    restart: "no"
    network_mode: "host"
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_RUNNER_PASSWORD}
      - POSTGRES_INITDB_ARGS=--nosync
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c log_statement=none -p 5433
    tmpfs:
      - /var/lib/postgresql/data:size=512m

  # scripts/deploy.sh never restarts this container: after changing the
  # settings below, apply them by hand with
  # `docker compose -f docker-compose.prod.yml up -d postgres`.
  # Memory settings default to a host with ~4 GB for Postgres; size them to
  # the real host in .env (shared_buffers ~25% of RAM, effective_cache_size
  # ~60-70%).
  postgres:
    image: postgres:15-alpine
    container_name: athena_prod_postgres
    restart: always
    env_file:
      - .env
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=top
      -c shared_buffers=${PG_SHARED_BUFFERS:-1GB}
      -c effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-3GB}
      -c work_mem=${PG_WORK_MEM:-16MB}
      -c maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-256MB}
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c track_io_timing=on
      -c log_min_duration_statement=${PG_LOG_MIN_DURATION_MS:-500}
    shm_size: ${PG_SHM_SIZE:-1gb}
    ports:
      - "${POSTGRES_PORT_EXTERNAL:-5432}:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data

  minio:
    image: quay.io/minio/minio
    container_name: athena_prod_minio
    restart: always
    command: server /data --console-address ":9001"
    env_file:
      - .env
    volumes:
      - minio_prod_data:/data
    ports:
      - "${MINIO_PORT_EXTERNAL:-9000}:9000"
      - "${MINIO_CONSOLE_PORT_EXTERNAL:-9001}:9001"

  minio-init:
    image: quay.io/minio/mc
    depends_on:
      - minio
    env_file:
      - .env
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until /usr/bin/mc alias set myminio http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          echo 'Waiting for MinIO...'
          sleep 1
        done
        /usr/bin/mc mb --ignore-existing "myminio/$$MINIO_BUCKET"
        /usr/bin/mc anonymous set none "myminio/$$MINIO_BUCKET"

volumes:
  postgres_prod_data:
  minio_prod_data:
